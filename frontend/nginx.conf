# Crawler / social-scraper detection. conf.d/*.conf is included in the http
# context, so this map is valid here. Bots get server-rendered OG/JSON-LD
# (dynamic rendering); humans get the SPA.
map $http_user_agent $is_bot {
    default 0;
    "~*(googlebot|bingbot|yandex|duckduckbot|baiduspider|twitterbot|facebookexternalhit|facebot|linkedinbot|slackbot|telegrambot|discordbot|whatsapp|embedly|quora link preview|pinterest|redditbot|applebot|skypeuripreview|vkshare|outbrain|nuzzel|bitlybot|google page speed|developers\.google\.com/\+/web/snippet)" 1;
}

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Gzip static assets
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/xml
        application/json
        application/javascript
        application/rss+xml
        application/atom+xml
        image/svg+xml;

    # Cache hashed assets aggressively (Vite includes hash in filenames).
    # `^~` stops the regex static-asset location below from overriding this.
    location ^~ /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # PWA manifest — explicit content-type (not always in mime.types).
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires 7d;
        add_header Cache-Control "public";
    }

    # Root-level static assets (favicon, icons, OG image, fonts) emitted by Vite
    # from public/ at the web root. Cache for a week.
    location ~* \.(?:png|svg|ico|jpe?g|gif|webp|avif|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # Healthcheck endpoint — returns 200 OK (no filesystem read needed)
    location /healthz {
        access_log off;
        return 200 "ok\n";
        add_header Content-Type text/plain;
    }

    # SEO discovery files — served dynamically by the backend so the sitemap is
    # DB-backed and both files carry a host-aware absolute Sitemap URL.
    location = /sitemap.xml {
        proxy_pass http://backend:3000/api/v1/seo/sitemap.xml;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }
    location = /robots.txt {
        proxy_pass http://backend:3000/api/v1/seo/robots.txt;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # API proxy -> backend (same-origin keeps SameSite cookies + avoids CORS)
    location /api/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # WebSocket proxy -> backend (Socket.IO)
    location /socket.io/ {
        proxy_pass http://backend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
    }

    # Internal: server-rendered crawler document (Open Graph / Twitter / JSON-LD).
    # Reached only via the @app rewrite for bot user-agents.
    location /__prerender {
        internal;
        proxy_pass http://backend:3000/api/v1/seo/prerender;
        proxy_set_header Host $host;
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host $http_host;
    }

    # SPA fallback. Real files are served directly; unknown paths fall through to
    # @app, which serves index.html to humans and the prerender to crawlers.
    location / {
        try_files $uri $uri/ @app;
    }

    location @app {
        # Crawlers/social scrapers get server-rendered metadata instead of the
        # empty SPA shell. rewrite-in-if is one of nginx's safe `if` uses.
        if ($is_bot) {
            rewrite ^ /__prerender last;
        }
        # Prevent caching the entry point so browsers always get the latest version
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        add_header Pragma no-cache;
        add_header Expires 0;
        # Security headers — repeated here because nginx suppresses inherited
        # add_header directives when a location defines its own. This is the
        # document Lighthouse audits, so CSP + HSTS live here.
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy strict-origin-when-cross-origin always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
        add_header Cross-Origin-Opener-Policy same-origin always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; img-src 'self' data: blob: https: http:; media-src 'self' blob: https: http:; font-src 'self' https://fonts.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; script-src 'self'; connect-src 'self' ws: wss:; form-action 'self'" always;
        try_files /index.html =404;
    }

    # Security headers for proxied + non-@app responses (API, socket, sitemap,
    # robots, prerender). The @app HTML document repeats these and adds CSP/HSTS.
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy same-origin always;
}
