# docker-compose.test.yml — Integration test overrides
# Exposes db and redis ports to the host for integration tests.
#
# Usage:
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d db redis
#
services:
  db:
    ports:
      - "5433:5432"

  redis:
    ports:
      - "6380:6379"
