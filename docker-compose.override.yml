services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    volumes:
      # Workspace layout: the backend package lives at /app/backend in the image.
      - ./backend/src:/app/backend/src
    # WORKDIR is /app/backend, so `npm run dev` runs the backend workspace's dev
    # script. nest start --watch recompiles via tsc, emitting decorator metadata
    # that NestJS DI and class-transformer require (tsx/esbuild cannot emit it).
    command: ["npm", "run", "dev"]
    environment:
      NODE_ENV: development
      WEB_ORIGIN: http://localhost:5173
    ports:
      - "3000:3000"

  # Dev frontend: Vite HMR in-container (overrides the prod nginx build).
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: dev
    volumes:
      # Workspace layout: the frontend package lives at /app/frontend; the anon
      # volume preserves its node_modules. Hoisted deps at /app/node_modules
      # (baked into the dev stage) are not shadowed and stay resolvable.
      - ./frontend:/app/frontend
      - /app/frontend/node_modules
    environment:
      VITE_PROXY_TARGET: http://backend:3000
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0", "--port", "5173"]
    ports:
      - "5173:5173"
