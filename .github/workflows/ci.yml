name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  TURBO_TELEMETRY_DISABLED: 1

jobs:
  # ── 1. Lint + typecheck (Turbo, all workspaces) ─────────────────────────────
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install workspace deps
        run: npm ci
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Lint + typecheck
        run: npx turbo run lint typecheck

  # ── 2. Unit tests (fast feedback, no DB required) ───────────────────────────
  unit-test:
    name: Unit Tests
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install workspace deps
        run: npm ci
      - name: Restore Turbo cache
        uses: actions/cache@v4
        with:
          path: .turbo
          key: turbo-${{ runner.os }}-${{ github.sha }}
          restore-keys: |
            turbo-${{ runner.os }}-
      - name: Unit tests (all packages)
        run: npx turbo run test
      - name: Frontend unit coverage
        run: npx turbo run test:coverage --filter=frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/

  # ── 3. Integration tests (Postgres + Redis via services) ────────────────────
  integration-test:
    name: Integration Tests
    needs: unit-test
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: tweeter
          POSTGRES_USER: tweeter
          POSTGRES_PASSWORD: tweeter
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
        ports:
          - 5433:5432

      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
        ports:
          - 6380:6379

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install workspace deps
        run: npm ci

      # Create the test DB and apply migrations
      - name: Create test database
        run: psql postgresql://tweeter:tweeter@localhost:5433/tweeter -c "CREATE DATABASE tweeter_test;"

      - name: Run migrations on test DB
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tweeter:tweeter@localhost:5433/tweeter_test
        run: npm run migration:run

      # Run integration tests (standalone, confirms integration suite green)
      - name: Run integration tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tweeter:tweeter@localhost:5433/tweeter_test
          REDIS_URL: redis://localhost:6380
          WEB_ORIGIN: http://localhost:5173
          MINIO_ENDPOINT: localhost
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          JWT_ACCESS_SECRET: ci_integration_access_secret
          JWT_REFRESH_SECRET: ci_integration_refresh_secret
        run: |
          DATABASE_URL=postgresql://tweeter:tweeter@localhost:5433/tweeter_test \
          REDIS_URL=redis://localhost:6380 \
          WEB_ORIGIN=http://localhost:5173 \
          MINIO_ENDPOINT=localhost \
          MINIO_ACCESS_KEY=minioadmin \
          MINIO_SECRET_KEY=minioadmin \
          npx vitest run --config vitest.integration.config.ts

      # Run combined (unit + integration) coverage — this is the 80% lines gate.
      # Running both suites together under a single v8 coverage pass ensures we measure
      # the true covered surface: unit tests cover services/utils/guards, integration
      # tests cover controllers/processors/adapters/gateway via the full Fastify stack.
      - name: Backend combined coverage (unit + integration) — 80% lines gate
        working-directory: backend
        env:
          DATABASE_URL: postgresql://tweeter:tweeter@localhost:5433/tweeter_test
          REDIS_URL: redis://localhost:6380
          WEB_ORIGIN: http://localhost:5173
          MINIO_ENDPOINT: localhost
          MINIO_ACCESS_KEY: minioadmin
          MINIO_SECRET_KEY: minioadmin
          JWT_ACCESS_SECRET: ci_integration_access_secret
          JWT_REFRESH_SECRET: ci_integration_refresh_secret
        run: npm run test:coverage:combined
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-combined-coverage
          path: backend/coverage-combined/

  # ── 4. E2E (Playwright against dockerized prod-like stack) ──────────────────
  e2e:
    name: E2E Tests (Playwright)
    needs: integration-test
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: e2e_ci_access_secret_32chars_long
      JWT_REFRESH_SECRET: e2e_ci_refresh_secret_32chars_long
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - name: Install workspace deps (root brings Playwright)
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      # Boot the prod-like stack with e2e override:
      #   - NODE_ENV=test to skip SSL (compose postgres has no SSL)
      #   - FRONTEND_PORT=18080 to match PLAYWRIGHT_BASE_URL (avoids port 8080 conflicts)
      - name: Start Dockerized stack
        env:
          FRONTEND_PORT: "18080"
          WEB_ORIGIN: "http://localhost:18080"
        run: |
          NODE_VERSION=$(cat .nvmrc) docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
        timeout-minutes: 15

      # If the stack failed to come up healthy, surface the container states and
      # backend logs — `compose up --wait` only reports "unhealthy" without them.
      - name: Dump stack logs on failure
        if: failure()
        run: |
          echo "::group::compose ps"
          NODE_VERSION=$(cat .nvmrc) FRONTEND_PORT=18080 WEB_ORIGIN=http://localhost:18080 \
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a || true
          echo "::endgroup::"
          echo "::group::backend logs"
          docker logs tweeter-backend-1 --tail 400 2>&1 || true
          echo "::endgroup::"

      # Run DB migrations inside the running backend container.
      # Workspace layout: app at /app/backend; typeorm bin hoisted to /app/node_modules/.bin.
      - name: Run database migrations
        run: |
          docker exec -w /app/backend tweeter-backend-1 \
            npx typeorm migration:run -d dist/infra/database/data-source.js

      - name: Run Playwright E2E tests
        env:
          PLAYWRIGHT_BASE_URL: http://localhost:18080
        run: npx playwright test --reporter=github

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v

  # ── 5. Build (docker compose build — confirms images build clean) ────────────
  build:
    name: Docker Build
    needs: e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build all images
        run: NODE_VERSION=$(cat .nvmrc) docker compose build

  # ── 6. Bundle-size budget (size-limit on the built frontend) ─────────────────
  bundle-size:
    name: Bundle Size Budget
    needs: lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci
      - name: Build frontend
        run: npm run -w frontend build
      - name: Check bundle-size budget
        run: npm run -w frontend size

  # ── 7. Lighthouse benchmarks (SEO / a11y / best-practices / perf gate) ───────
  lighthouse:
    name: Lighthouse Benchmarks
    needs: e2e
    runs-on: ubuntu-latest
    env:
      JWT_ACCESS_SECRET: e2e_ci_access_secret_32chars_long
      JWT_REFRESH_SECRET: e2e_ci_refresh_secret_32chars_long
      LH_BASE_URL: http://localhost:18080
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: npm
      - run: npm ci

      - name: Start Dockerized stack
        env:
          FRONTEND_PORT: "18080"
          WEB_ORIGIN: "http://localhost:18080"
        run: |
          NODE_VERSION=$(cat .nvmrc) docker compose -f docker-compose.yml -f docker-compose.e2e.yml up -d --build --wait
        timeout-minutes: 15

      - name: Dump stack logs on failure
        if: failure()
        run: |
          NODE_VERSION=$(cat .nvmrc) FRONTEND_PORT=18080 WEB_ORIGIN=http://localhost:18080 \
            docker compose -f docker-compose.yml -f docker-compose.e2e.yml ps -a || true
          docker logs tweeter-backend-1 --tail 400 2>&1 || true

      - name: Run database migrations
        run: |
          docker exec -w /app/backend tweeter-backend-1 \
            npx typeorm migration:run -d dist/infra/database/data-source.js

      - name: Seed public content for Lighthouse
        run: node scripts/seed-lighthouse.mjs

      - name: Run Lighthouse CI
        run: npx lhci autorun

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-results
          path: .lighthouseci/

      - name: Tear down stack
        if: always()
        run: docker compose -f docker-compose.yml -f docker-compose.e2e.yml down -v
